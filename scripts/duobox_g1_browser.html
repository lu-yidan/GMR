<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>DuoBox · 双 G1 动作浏览器</title>
<style>body{margin:0;background:#101722;color:#e5edf8;font:15px system-ui}header{padding:20px 24px;background:#192638}h2{margin:0 0 7px}small{color:#a9b9cc}.bar{padding:12px 24px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}button,select,input{font:inherit}button,select{background:#263b54;color:white;padding:8px;border:1px solid #647a95;border-radius:6px}button:disabled{opacity:.4}#view{width:100%;height:60vh;display:block}#seek{flex:1;min-width:180px}#status,#metrics{margin:8px 24px}#clip{max-width:60vw}a{color:#54c5ff}</style>
<script type="importmap">{"imports":{"three":"/vendor/three.module.js"}}</script>
<style>.boxer-nav{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 24px;background:#0b1423;border-bottom:1px solid #30415a;font:14px system-ui}.boxer-nav a{padding:8px 12px;border-radius:6px;color:#aebed3;text-decoration:none}.boxer-nav a:hover{background:#23344e;color:#fff}.boxer-nav a[aria-current=page]{background:#234572;color:#fff}.boxer-nav a:focus-visible{outline:2px solid #73c8ff}</style><nav class="boxer-nav" aria-label="功能导航"><a href="http://127.0.0.1:19093/hub">总入口</a><a href="http://127.0.0.1:19091/">01 原始数据</a><a href="http://127.0.0.1:19094/">02 人体响应</a><a href="http://127.0.0.1:19093/" aria-current="page">03 G1 回放</a><a href="http://127.0.0.1:19093/live">04 实时链路</a></nav><header><h2>DuoBox · 双 G1 动作浏览器</h2><a href="/live">打开实时链路监视器 →</a><small>117 段双人动作 · 30 FPS 回放 · 原始/修正版：运动学；在线响应版：蓝色 G1 物理仿真 · 均无双方碰撞</small></header>
<div class="bar"><label>动作 <select id="clip" disabled aria-label="动作序列"></select></label><label>版本 <select id="mode" disabled aria-label="重定向版本"><option value="body_anchor">骨盆／躯干跟踪修正版 v10</option><option value="geometry">动作自适应修正版 v7</option><option value="legacy_v5">v5 固定限速（历史对照）</option><option value="continuous">连续性约束版</option><option value="reactive_rt3">实时响应 → 3 部位（无 IK）→ ScaleBFM</option><option value="reactive_stream">在线响应 → GMR → ScaleBFM 物理仿真</option><option value="baseline">原始 GMR</option></select></label><button id="generate" disabled>生成此段 G1 动作</button></div>
<div class="bar"><button id="play">暂停</button><button id="prev">上一帧</button><button id="next">下一帧</button><label>速度 <select id="speed"><option value=".25">0.25×</option><option value=".5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label><button id="reset">重置视角</button><span id="legend"></span></div>
<canvas id="view" aria-label="双 G1 三维动作"></canvas><div class="bar"><input id="seek" aria-label="播放进度" type="range" min="0" max="1" value="0" step="1"><label>帧号 <input id="frameNumber" aria-label="帧号" type="number" min="0" value="0" style="width:80px"></label><span id="time">0 s</span></div>
<p id="pipelineNote" style="margin:8px 24px;color:#a9b9cc" hidden>前 4 秒 · 前 4 帧热启动 · 橙色为第二位演员的预录轨迹，蓝色由模型生成并做物理跟踪。逐块计算后回放，不保证墙钟实时；上层未接机器人实际状态反馈，无双方碰撞。</p><p id="status">正在加载机器人…</p><p id="metrics"></p><div class="bar"><small>左键旋转 · 滚轮缩放 · 右键平移 · 时间轴逐帧查看。未生成的序列需点击生成，结果会缓存。</small><a id="download" hidden>下载当前双人关节轨迹</a></div>
<script type="module">
import * as THREE from 'three';import {OrbitControls} from '/vendor/OrbitControls.js';
const $=id=>document.getElementById(id),canvas=$('view');let animation=null,frame=0,playing=true,epoch=0,last=0,poll=null,robots=[],center=new THREE.Vector3();
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setClearColor(0x101722);const scene=new THREE.Scene();scene.add(new THREE.HemisphereLight(0xc9e4ff,0x606060,2));const light=new THREE.DirectionalLight(0xffffff,3);light.position.set(3,-4,6);scene.add(light);const camera=new THREE.PerspectiveCamera(40,1,.01,100);camera.up.set(0,0,1);const controls=new OrbitControls(camera,canvas);controls.enableDamping=true;const grid=new THREE.GridHelper(12,24,0x69798b,0x304155);grid.rotation.x=Math.PI/2;scene.add(grid);
function reset(){controls.target.copy(center);camera.position.copy(center).add(new THREE.Vector3(2.7,-3.5,1.8));controls.update()}reset();
function query(){return '?id='+$('clip').value+'&mode='+$('mode').value}
function playState(){ $('play').textContent=playing?'暂停':'播放' }
async function json(url,options){const r=await fetch(url,options);const d=await r.json();if(!r.ok)throw Error(d.error||r.statusText);return d}
function visibility(value){for(const groups of robots)for(const g of groups)g.visible=value}
async function select(){$('pipelineNote').textContent=$('mode').value==='reactive_rt3'?'无 IK 的 3 部位实时调度实验；页面显示运行后的回放。新生成默认最多 10 秒，参考延迟 300 ms。':'逐块生成后回放；等待生成时暂停虚拟时间；非实时闭环。';$('pipelineNote').hidden=!['reactive_stream','reactive_rt3'].includes($('mode').value);const version=++epoch;clearTimeout(poll);animation=null;visibility(false);$('metrics').textContent='';$('download').hidden=true;$('generate').disabled=true;$('status').textContent='检查缓存…';try{const s=await json('/status'+query());if(version!==epoch)return;if(s.status==='ready'){const a=await json('/motion'+query());if(version!==epoch)return;animation=a;if(['reactive_stream','reactive_rt3'].includes($('mode').value))$('pipelineNote').textContent=a.metadata.note;frame=Math.min(frame,a.count-1);$('seek').max=a.count-1;$('frameNumber').max=a.count-1;center.set(a.center[0],a.center[1],.8);reset();visibility(true);$('legend').textContent='🔵 '+a.metadata.actors[0]+'　🟠 '+a.metadata.actors[1];$('status').textContent=$('clip').selectedOptions[0].textContent+' · '+a.count+' 帧 · 已缓存';const stats=Object.entries(a.metadata.diagnostics).map(([n,d])=>n+': 最大单帧关节变化 '+(d.max_frame_joint_change_rad*180/Math.PI).toFixed(1)+'°').join('；');$('metrics').textContent=stats+(['geometry','body_anchor'].includes($('mode').value)?'。前臂／手部与自身头部／躯干最小间距 '+Math.min(...Object.values(a.metadata.diagnostics).map(d=>d.min_arm_torso_clearance_m*1000)).toFixed(1)+' mm；手掌额度随源动作变化；支撑脚为高度／速度启发式修正，非物理平衡。':$('mode').value==='legacy_v5'?'。v5 固定手掌额度 3 cm / 10°，可能明显损失出拳动态。':$('mode').value==='continuous'?'。关节速度上限 8 rad/s；未限制浮动基座或加速度。':'。原始 GMR 未添加输出帧连续性约束。');if(['reactive_stream','reactive_rt3'].includes($('mode').value)){$('metrics').textContent=a.metadata.note+' 计算用时 '+a.metadata.wall_seconds.toFixed(1)+' s；结果 '+(a.metadata.failure||'完成');}$('download').href='/download'+query();$('download').hidden=false;playState()}else if(s.status==='running'){$('status').textContent=(['reactive_stream','reactive_rt3'].includes($('mode').value)?'正在逐块生成、重定向和物理仿真，已完成 '+(s.progress||0)+' 帧…':'正在排队或执行 GMR，生成期间可选择其他动作…');poll=setTimeout(()=>{if(version===epoch)select()},1500)}else{$('status').textContent=s.status.startsWith('error')?s.status:'这段尚未生成，点击“生成此段 G1 动作”。';$('generate').disabled=false}}catch(e){if(version===epoch){$('status').textContent=String(e);$('generate').disabled=false}}}
$('generate').onclick=async()=>{const v=epoch;$('generate').disabled=true;try{await json('/generate'+query(),{method:'POST'});if(v===epoch)select()}catch(e){$('status').textContent=String(e);$('generate').disabled=false}};
$('clip').onchange=()=>{frame=0;select()};$('mode').onchange=select;$('play').onclick=()=>{playing=!playing;playState()};$('reset').onclick=reset;$('seek').oninput=()=>{frame=Number($('seek').value);playing=false;playState()};$('frameNumber').onfocus=()=>{playing=false;playState()};$('frameNumber').oninput=()=>{if(animation){frame=Math.max(0,Math.min(animation.count-1,Number($('frameNumber').value)||0));playing=false;playState()}};function step(d){if(animation){playing=false;frame=Math.max(0,Math.min(animation.count-1,Math.floor(frame)+d));playState()}}$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);
function tick(t){const dt=last?Math.min((t-last)/1000,.1):0;last=t;const w=canvas.clientWidth,h=canvas.clientHeight;if(canvas.width!==Math.round(w*renderer.getPixelRatio())||canvas.height!==Math.round(h*renderer.getPixelRatio())){renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}if(animation){if(playing)frame=(frame+dt*30*Number($('speed').value))%animation.count;const f=Math.floor(frame),n=animation.bodies,values=animation.frames;for(let a=0;a<2;a++)for(let b=0;b<n;b++){const i=((f*2+a)*n+b)*7,g=robots[a][b];g.position.set(values[i],values[i+1],values[i+2]);g.quaternion.set(values[i+4],values[i+5],values[i+6],values[i+3])}$('seek').value=f;if(document.activeElement!==$('frameNumber'))$('frameNumber').value=f;$('time').textContent=(f/30).toFixed(2)+' / '+(animation.count/30).toFixed(2)+' s · 第 '+f+' 帧'}controls.update();renderer.render(scene,camera);requestAnimationFrame(tick)}requestAnimationFrame(tick);
try{const [s,rows]=await Promise.all([json('/scene'),json('/catalog')]);const geometries=s.meshes.map(m=>{const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(m.vertices,3));g.setIndex(m.faces);g.computeVertexNormals();return g});for(let a=0;a<2;a++){const groups=Array.from({length:s.bodies},()=>{const g=new THREE.Group();g.visible=false;scene.add(g);return g});const material=new THREE.MeshStandardMaterial({color:a?0xf97e25:0x26b6f2,metalness:.3,roughness:.45});for(const v of s.geoms){const m=new THREE.Mesh(geometries[v.mesh],material);m.position.fromArray(v.position);m.quaternion.set(v.quaternion[1],v.quaternion[2],v.quaternion[3],v.quaternion[0]);groups[v.body].add(m)}robots.push(groups)}for(const r of rows){const o=document.createElement('option');o.value=r.id;o.textContent=r.name+' · '+r.seconds.toFixed(1)+'s';$('clip').append(o)}const initial=new URLSearchParams(location.search);$('clip').value=initial.get('id')||'3';if(!$('clip').value)$('clip').value='3';if(initial.get('mode')){$('mode').value=initial.get('mode');if(!$('mode').value)$('mode').value='body_anchor';}$('clip').disabled=false;$('mode').disabled=false;await select()}catch(e){$('status').textContent='加载失败：'+e}
</script></html>
